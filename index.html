<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>American Roulette</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0705;overflow:hidden;overscroll-behavior:none;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#f3e9d2;user-select:none;-webkit-user-select:none}
:root{color-scheme:dark}
#wrap{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse at 62% 38%,#2b1b10 0%,#160d07 55%,#0b0604 100%)}
/* ---------- top bar ---------- */
#topbar{position:absolute;left:0;top:0;width:1600px;height:60px;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(#21150c,#100905);border-bottom:1px solid #4d3420;box-shadow:0 4px 18px rgba(0,0,0,.5);z-index:20}
.brand{font-family:Georgia,serif;font-size:19px;font-weight:700;letter-spacing:2px;color:#e8c46a;white-space:nowrap;line-height:1.05}
.brand small{display:block;font-family:'Segoe UI',sans-serif;font-size:10px;letter-spacing:1.2px;color:#8fd6a8;font-weight:700}
.tb{display:flex;flex-direction:column;line-height:1.1;min-width:82px}
.tb .k{font-size:10px;letter-spacing:1.5px;color:#a88e6a;text-transform:uppercase;white-space:nowrap}
.tb .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.pos{color:#5fe08f}.neg{color:#ff6b6b}
#status{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
#topbar>.btn{white-space:nowrap}
#statusText{font-size:14px;font-weight:800;letter-spacing:1.5px;color:#ffe6a0;white-space:nowrap}
#timerBar{width:300px;height:6px;border-radius:4px;background:#3a2a1a;overflow:hidden}
#timerFill{height:100%;width:0;background:linear-gradient(90deg,#e05050,#f2c14e,#5fe08f);transition:width .1s linear}
.btn{font-family:inherit;background:linear-gradient(#3e2c1b,#24180d);border:1px solid #8a6a3a;color:#f3e3bf;border-radius:10px;padding:9px 14px;
  font-weight:800;font-size:13px;letter-spacing:1.2px;cursor:pointer;text-transform:uppercase;transition:transform .08s,border-color .15s,filter .15s}
.btn:hover{border-color:#ffd54a;filter:brightness(1.15)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn.gold{background:linear-gradient(#f0c35a,#a87514);color:#1d1206;border-color:#ffe29a}
.btn.red{background:linear-gradient(#a32424,#5c0e0e);border-color:#e66;color:#fff}
.btn.green{background:linear-gradient(#1f8a4c,#0d4f29);border-color:#5fe08f;color:#fff}
.btn.sm{padding:5px 10px;font-size:11px}
.btn small{display:block;font-size:9px;letter-spacing:1px;opacity:.7;font-weight:600}
/* ---------- wheel ---------- */
#wheel{position:absolute;left:40px;top:76px;width:520px;height:520px;filter:drop-shadow(0 22px 30px rgba(0,0,0,.75))}
#wheel.zoom{clip-path:circle(50% at 50% 50%)}
#plaque{position:absolute;left:225px;top:261px;width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:5px solid #e8c46a;box-shadow:0 0 40px rgba(255,210,100,.55),inset 0 0 20px rgba(0,0,0,.5);opacity:0;transform:scale(.6);transition:opacity .35s,transform .35s;pointer-events:none;z-index:6}
#plaque.show{opacity:1;transform:scale(1)}
#plaque .n{font-family:Georgia,serif;font-size:62px;font-weight:700;line-height:1;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#plaque .c{font-size:13px;letter-spacing:3px;font-weight:800;color:#fff;opacity:.9}
.bg-red{background:radial-gradient(circle at 40% 35%,#e0303a,#8c0d14)}
.bg-black{background:radial-gradient(circle at 40% 35%,#3a3a3a,#0a0a0a)}
.bg-green{background:radial-gradient(circle at 40% 35%,#22b864,#0a5e31)}
/* ---------- history panel ---------- */
.panel{position:absolute;background:linear-gradient(#1d130b,#140c07);border:1px solid #4a3220;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:12px 16px}
.ph{font-size:11px;letter-spacing:2px;color:#a88e6a;font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between}
#hist{left:30px;top:612px;width:540px;height:272px}
#lastNums{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 8px;height:78px;align-content:flex-start}
.ln{width:37px;height:37px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;border:2px solid rgba(255,255,255,.25);flex:none}
.ln.first{border-color:#ffd54a;box-shadow:0 0 10px rgba(255,213,74,.7)}
.dist{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;align-items:center;font-size:11px;color:#c8b28d;margin-bottom:6px}
.bar{display:flex;height:16px;border-radius:5px;overflow:hidden;font-size:10px;font-weight:800;background:#2a1d12}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.hc{display:flex;gap:6px;align-items:center;font-size:11px;color:#c8b28d;margin-top:2px}
.hc .ln{width:26px;height:26px;font-size:11px}
.foot{position:absolute;bottom:8px;left:16px;right:16px;font-size:10px;color:#7d6a50;font-style:italic}
/* ---------- felt & layout ---------- */
#felt{position:absolute;left:606px;top:84px;width:968px;height:420px;border-radius:26px;
  background:radial-gradient(ellipse at 50% 40%,#1f8049 0%,#14613a 55%,#0b3f22 100%);
  box-shadow:0 0 0 14px #5a3218,0 0 0 16px #c9a24a,0 0 0 19px #2a160a,0 20px 44px rgba(0,0,0,.7),inset 0 0 70px rgba(0,0,0,.45)}
#felt::after{content:'';position:absolute;inset:0;border-radius:26px;opacity:.18;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
.cell{position:absolute;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.82);font-weight:800;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.7);pointer-events:none;z-index:1;transition:box-shadow .12s}
.cell .num{width:44px;height:58px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:25px;font-family:Georgia,serif;box-shadow:inset 0 -3px 6px rgba(0,0,0,.35)}
.cell.red .num{background:linear-gradient(#d0222b,#9b0f17)}
.cell.black .num{background:linear-gradient(#2a2a2a,#0d0d0d)}
.cell.green{background:linear-gradient(#17a356,#0b6b37)}
.cell.green .num{font-size:30px;width:auto;height:auto;box-shadow:none}
.cell.zero0{border-bottom-left-radius:30px}
.cell.zero00{border-top-left-radius:30px}
.cell.out{font-size:17px;letter-spacing:1.5px;font-family:Georgia,serif}
.cell.hl{box-shadow:inset 0 0 0 300px rgba(255,236,160,.30)}
.cell.under{box-shadow:inset 0 0 0 300px rgba(255,60,60,.22)}
.diamond{width:30px;height:30px;transform:rotate(45deg);border:2px solid rgba(255,255,255,.8);border-radius:3px}
.zone{position:absolute;z-index:3;cursor:pointer;border-radius:7px}
.zone.edge:hover{background:rgba(255,245,190,.38);box-shadow:0 0 8px rgba(255,240,170,.6)}
#hint{position:absolute;left:634px;top:478px;width:912px;height:20px;font-size:12px;color:#cfe9d6;letter-spacing:.3px;z-index:2;display:flex;justify-content:space-between;gap:20px;white-space:nowrap}
#hint b{color:#ffe6a0}
#hintR{font-size:13px;color:#ffe6a0;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
#hintR .sname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
a.tolab.on{background:rgba(232,196,106,.28)}
#numTip{position:absolute;z-index:9;pointer-events:none;display:none;background:rgba(15,9,5,.97);border:1px solid #c9a24a;border-radius:10px;padding:8px 11px;
  font-size:12px;min-width:190px;max-width:300px;box-shadow:0 10px 24px rgba(0,0,0,.7);color:#d8c39d;line-height:1.5}
#numTip .t{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#a88e6a;margin-bottom:3px}
#numTip .r{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
#numTip .r b{color:#fff}
#numTip .r .big{font-size:16px}
#numTip .h{font-size:11px;margin-top:4px;border-top:1px solid #33241a;padding-top:4px}
.netTag{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font:800 10.5px/1.3 'Segoe UI',system-ui,sans-serif;padding:0 5px;border-radius:5px;
  background:rgba(8,5,3,.82);pointer-events:none;white-space:nowrap;letter-spacing:0;text-shadow:none;z-index:2}
.netTag.up{color:#6dffa0}.netTag.mixed{color:#ffc46b}.netTag.down{color:#ff8a8a;opacity:.85}
body.portrait .netTag{left:auto;right:3px;bottom:auto;top:50%;transform:translateY(-50%);font-size:9.5px}
body.portrait #numTip{font-size:11px;min-width:170px}
#hintR i{font-style:normal;color:#a7d9b8;font-weight:600}
/* ---------- chips ---------- */
.chip{position:absolute;border-radius:50%;z-index:4;pointer-events:none;display:flex;align-items:center;justify-content:center;
  font-weight:900;color:var(--t);font-size:12px;letter-spacing:-.3px;
  background:repeating-conic-gradient(var(--c) 0deg 30deg,var(--e) 30deg 45deg);
  transition:left .55s cubic-bezier(.4,.1,.3,1),top .55s cubic-bezier(.4,.1,.3,1),opacity .55s,transform .25s}
.chip::before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--c);border:1.5px dashed rgba(255,255,255,.65)}
.chip.dk::before{border-color:rgba(40,40,90,.55)}
.chip span{position:relative;z-index:1}
.chip.under{outline:3px solid #ff4d4d;outline-offset:2px}
.chip.win{animation:pulse .5s infinite alternate}
.chip.gone{opacity:0}
@keyframes pulse{from{transform:scale(1);filter:drop-shadow(0 0 2px #ffd54a)}to{transform:scale(1.18);filter:drop-shadow(0 0 12px #ffd54a)}}
.payf{position:absolute;z-index:7;pointer-events:none;font-weight:900;font-size:18px;color:#ffe680;text-shadow:0 2px 6px #000;animation:rise 1.8s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
#dolly{position:absolute;z-index:5;width:30px;height:44px;pointer-events:none;display:none}
#dolly .h{position:absolute;left:7px;top:0;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#c8c8c8)}
#dolly .b{position:absolute;left:3px;top:13px;width:24px;height:28px;border-radius:7px 7px 12px 12px;background:radial-gradient(circle at 35% 30%,#fff,#b8b8b8);box-shadow:0 6px 10px rgba(0,0,0,.6)}
/* ---------- rack ---------- */
#rack{position:absolute;left:606px;top:532px;width:968px;height:118px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(#2b1a0e,#1a0f07);border:1px solid #5a3a20;border-radius:16px;box-shadow:inset 0 4px 14px rgba(0,0,0,.6)}
#rackChips{display:flex;gap:10px;align-items:flex-end;height:86px}
.rchip{width:60px;height:60px;font-size:15px;position:relative;cursor:pointer;pointer-events:auto;transition:transform .15s,box-shadow .15s,opacity .2s;
  box-shadow:0 4px 0 rgba(0,0,0,.45),0 6px 12px rgba(0,0,0,.5)}
.rchip.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--pc,#ffd54a),0 12px 18px rgba(0,0,0,.6)}
.rchip.off{opacity:.3;cursor:not-allowed}
.rchip .key{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:9px;color:#8f7756;font-weight:700;z-index:1}
#betInfo{width:205px;font-size:12px;line-height:1.5;color:#d8c39d;border-left:1px solid #4a3220;border-right:1px solid #4a3220;padding:0 12px}
#betInfo b{color:#fff;font-size:13px}
.ok{color:#5fe08f;font-weight:800}.bad{color:#ff6b6b;font-weight:800}
#actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
#actions .btn{padding:7px 4px;font-size:11.5px;letter-spacing:.8px}
#spinBtn{grid-column:span 2;font-size:13px !important}
#bAuto.running{background:linear-gradient(#a32424,#5c0e0e);border-color:#e66;color:#fff;animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 14px rgba(255,90,90,.7)}}
/* ---------- stats panel ---------- */
#stats{left:606px;top:664px;width:968px;height:220px;display:flex;gap:16px}
#sessGrid{width:330px;display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;margin-top:6px}
.sg .k{font-size:10px;letter-spacing:1.3px;color:#a88e6a;text-transform:uppercase}
.sg .v{font-size:15px;line-height:19px;font-weight:800;font-variant-numeric:tabular-nums}
.sg .k{line-height:14px}
#chartWrap{flex:1;display:flex;flex-direction:column}
#chart{width:592px;height:180px;margin-top:6px;border-radius:10px;background:#100a06;border:1px solid #33241a}
/* ---------- overlays ---------- */
#centerMsg{position:absolute;left:50%;margin-left:290px;translate:-50% 0;top:200px;padding:10px 40px;border-radius:18px;background:rgba(8,20,12,.82);border:1px solid rgba(232,196,106,.6);
  white-space:nowrap;text-align:center;z-index:8;pointer-events:none;font-family:Georgia,serif;font-size:54px;font-weight:700;
  letter-spacing:4px;color:#ffe6a0;text-shadow:0 4px 18px rgba(0,0,0,.9),0 0 30px rgba(255,200,80,.35);opacity:0;transition:opacity .35s,transform .35s;transform:scale(.9)}
#centerMsg.show{opacity:1;transform:scale(1)}
#centerMsg.win{color:#7dffb0}
#centerMsg.mixed{color:#ffc46b}
/* bet history */
.hsum{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 12px}
.hsum>div{background:#0f0905;border:1px solid #33241a;border-radius:10px;padding:8px 10px}
.hsum .k{font-size:10px;letter-spacing:1.2px;color:#a88e6a;text-transform:uppercase}
.hsum .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
table.hist{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.hist th{text-align:right;font-size:10px;letter-spacing:1.4px;color:#a88e6a;text-transform:uppercase;padding:7px 8px;border-bottom:1px solid #4a3220;position:sticky;top:0;background:#1d130b;z-index:1}
table.hist th:nth-child(-n+2){text-align:left}
table.hist td{padding:7px 8px;text-align:right}
table.hist td:nth-child(-n+2){text-align:left}
table.hist tr.main td{border-top:1px solid #2c1e13}
table.hist tr.sub td{padding:0 8px 8px;text-align:left;font-size:11.5px;color:#a88e6a}
table.hist .ln{width:28px;height:28px;font-size:12px;display:inline-flex}
table.hist .tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9px;font-size:10px;font-weight:800;letter-spacing:.5px;vertical-align:middle}
.tag.fake{background:rgba(255,196,107,.15);color:#ffc46b;border:1px solid rgba(255,196,107,.5)}
.tag.won{background:rgba(95,224,143,.12);color:#5fe08f;border:1px solid rgba(95,224,143,.4)}
.tag.miss{background:rgba(255,107,107,.1);color:#ff8f8f;border:1px solid rgba(255,107,107,.35)}
.hitline b{color:#f3e9d2;font-weight:700}
body.portrait .hsum{grid-template-columns:repeat(3,1fr)}
body.portrait .hsum .v{font-size:15px}
body.portrait table.hist{font-size:12px}
body.portrait table.hist td,body.portrait table.hist th{padding:6px 5px}
#autoBar{position:absolute;left:606px;top:66px;width:968px;display:none;justify-content:center;z-index:9;pointer-events:none}
#autoBar div{background:rgba(90,12,12,.92);border:1px solid #ff8a8a;color:#ffe0e0;padding:4px 16px;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:1px}
#toast{position:absolute;left:606px;top:96px;width:968px;display:flex;justify-content:center;z-index:9;pointer-events:none}
#toast div{background:rgba(20,10,5,.92);border:1px solid #c9a24a;color:#ffe6a0;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.6);
  opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s;max-width:860px;text-align:center}
#toast div.show{opacity:1;transform:none}
#toast div.warn{border-color:#ff6b6b;color:#ffd0d0}
#modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(5,3,2,.72);backdrop-filter:blur(3px)}
#modal.show{display:flex}
#mbox{width:660px;max-height:860px;overflow:auto;background:linear-gradient(#24170d,#160d07);border:1px solid #c9a24a;border-radius:20px;padding:26px 34px;box-shadow:0 30px 80px rgba(0,0,0,.8)}
#mbox.wide{width:1240px}
#mbox h2{font-family:Georgia,serif;color:#e8c46a;font-size:30px;letter-spacing:1px;margin-bottom:4px}
#mbox .sub{color:#a88e6a;font-size:13px;margin-bottom:16px;line-height:1.45}
#mbox label.l{display:block;font-size:11px;letter-spacing:2px;color:#a88e6a;text-transform:uppercase;margin:16px 0 8px;font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1}
.seg.wrap button{flex:0 0 auto}
.seg button.on{background:linear-gradient(#f0c35a,#a87514);color:#1d1206;border-color:#ffe29a}
.bigv{font-size:44px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;text-align:center;margin:4px 0}
input[type=range]{width:100%;accent-color:#e8b84a;height:22px}
input.tx,select.tx{font-family:inherit;background:#0f0905;border:1px solid #6a4c2a;color:#fff;border-radius:8px;padding:9px 12px;font-size:14px;width:100%}
input.tx:focus{outline:none;border-color:#ffd54a}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mrow{display:flex;gap:10px;margin-top:22px}
.mrow .btn{flex:1;padding:14px;font-size:15px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:18px 0}
.sumgrid .k{font-size:11px;letter-spacing:1.5px;color:#a88e6a;text-transform:uppercase}
.sumgrid .v{font-size:20px;font-weight:800}
.netbig{text-align:center;font-size:58px;font-weight:900;margin:10px 0 0}
.resume{background:#0f2a1a;border:1px solid #2f9a5e;border-radius:12px;padding:14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
table.lt{width:100%;border-collapse:collapse;font-size:13px}
table.lt th{text-align:left;font-size:10px;letter-spacing:1.5px;color:#a88e6a;text-transform:uppercase;padding:7px 8px;border-bottom:1px solid #4a3220;position:sticky;top:0;background:#1d130b;z-index:1}
table.lt td{padding:6px 8px;border-bottom:1px solid #2c1e13;font-variant-numeric:tabular-nums;vertical-align:middle}
table.lt td .d{font-size:11px;color:#a88e6a}
.tscroll{max-height:440px;overflow:auto;border:1px solid #33241a;border-radius:10px;margin-top:12px}
.note{font-size:12px;color:#a88e6a;margin-top:10px;line-height:1.5}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:10px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:#e8b84a}
.tabs{display:flex;gap:6px;margin-top:6px}
.tabs .btn.on{background:linear-gradient(#f0c35a,#a87514);color:#1d1206;border-color:#ffe29a}
.preview{background:#0f0905;border:1px solid #4a3220;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;line-height:1.5}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:360px;overflow:auto}
.pitem{display:flex;align-items:center;gap:10px;background:#0f0905;border:1px solid #33241a;border-radius:10px;padding:10px 12px}
.pitem .nm{flex:1;font-weight:700}
.mpchip{position:absolute;border-radius:50%;z-index:4;pointer-events:none;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 4px rgba(0,0,0,.6)}
body.mp #dist,body.mp #hot,body.mp #cold,body.mp #hist .foot{display:none}
#seats .seat{display:grid;grid-template-columns:14px 1fr 92px 64px;align-items:center;gap:8px;font-size:12px;padding:3px 4px;border-radius:6px;color:#d8c39d;font-variant-numeric:tabular-nums}
#seats .seat i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.8)}
#seats .seat.open{color:#6f5c44}
#seats .seat.me{background:rgba(232,196,106,.12)}
#seats .seat .nm{color:#f3e9d2;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
'use strict';
/* ======================= constants ======================= */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const WHEEL=[0,28,9,26,30,11,7,20,32,17,5,22,34,15,3,24,36,13,1,37,27,10,25,29,12,8,19,31,18,6,21,33,16,4,23,35,14,2]; // 37 = 00
const RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const lab=n=>n===37?'00':String(n);
const colorOf=n=>(n===0||n===37)?'green':RED.has(n)?'red':'black';
const DENOMS=[1,5,25,100,500];
const CHIPSTYLE={1:{c:'#f2f2f2',e:'#2a5bd7',t:'#1a1a40',dk:1},5:{c:'#c62828',e:'#fff',t:'#fff'},25:{c:'#1f7a33',e:'#fff',t:'#fff'},100:{c:'#1b1b1b',e:'#e8c46a',t:'#fff'},500:{c:'#6a1b9a',e:'#f6d860',t:'#fff'}};
// Black Hawk house limits (assumed — casinos don't publish per-number caps; editable in Settings)
const DEFAULT_LIMITS={10:{str:100,out:2000},15:{str:150,out:3000}};
const money=v=>'$'+Math.round(v).toLocaleString();
const smoney=v=>(v>0?'+':v<0?'−':'')+'$'+Math.abs(Math.round(v)).toLocaleString();
const cls=v=>v>0?'pos':v<0?'neg':'';
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const lerp=(a,b,t)=>a+(b-a)*t;
const mod=(a,m)=>((a%m)+m)%m;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* True RNG for the result: crypto-grade, rejection-sampled so all 38 pockets are exactly equal. */
function rngPocket(){const a=new Uint32Array(1);const lim=Math.floor(4294967296/38)*38;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%38}

/* ======================= storage ======================= */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let settings=Object.assign({timer:25,sound:true,autoRebet:false,lastBuyIn:200,lastMin:10,leaveUp:true,zoom:true,ambient:true,voice:true,volume:.8,spinMode:'standard',
  limits:JSON.parse(JSON.stringify(DEFAULT_LIMITS))},store.get('rr_settings',{}));
if(settings.quickSpin){settings.spinMode='quick';delete settings.quickSpin}
const saveSettings=()=>store.set('rr_settings',settings);

/* ======================= sound (synthesized) + dealer voice ======================= */
const VOL_SCALE=.5;   // everything plays at half the old loudness; the volume slider works on top of this
const sfx=(()=>{let ctx=null,noise=null,brown=null,master=null,amb=null,rollN=null;
  function init(){if(ctx){if(ctx.state==='suspended')ctx.resume();return}try{ctx=new(window.AudioContext||window.webkitAudioContext)();const len=ctx.sampleRate*2;
    noise=ctx.createBuffer(1,len,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    brown=ctx.createBuffer(1,len*2,ctx.sampleRate);const b=brown.getChannelData(0);let last=0;for(let i=0;i<b.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;b[i]=last*3.5}
    master=ctx.createGain();master.gain.value=settings.volume*VOL_SCALE;master.connect(ctx.destination);
    if(settings.ambient)ambientStart()}catch(e){ctx=null}}
  const on=()=>settings.sound&&ctx;
  function click(t,f,g0,dur,dest){const s=ctx.createBufferSource();s.buffer=noise;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=2.5;
    const g=ctx.createGain();g.gain.setValueAtTime(g0,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(bp).connect(g).connect(dest||master);s.start(t,Math.random()*1.5);s.stop(t+dur+.03)}
  function tone(t,f,g0,dur,type='sine',dest){const o=ctx.createOscillator();o.type=type;o.frequency.value=f;const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(g0,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(dest||master);o.start(t);o.stop(t+dur+.05)}
  function ambientStart(){if(!ctx||amb)return;
    const src=ctx.createBufferSource();src.buffer=brown;src.loop=true;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;
    const g=ctx.createGain();g.gain.value=.11;const lfo=ctx.createOscillator();lfo.frequency.value=.11;const lg=ctx.createGain();lg.gain.value=.035;lfo.connect(lg).connect(g.gain);
    const v=ctx.createBufferSource();v.buffer=noise;v.loop=true;const vb=ctx.createBiquadFilter();vb.type='bandpass';vb.frequency.value=650;vb.Q.value=.8;
    const vg=ctx.createGain();vg.gain.value=.018;const lfo2=ctx.createOscillator();lfo2.frequency.value=.37;const lg2=ctx.createGain();lg2.gain.value=.01;lfo2.connect(lg2).connect(vg.gain);
    const far=ctx.createBiquadFilter();far.type='lowpass';far.frequency.value=2200;const fg=ctx.createGain();fg.gain.value=.5;far.connect(fg).connect(master);
    src.connect(lp).connect(g).connect(master);v.connect(vb).connect(vg).connect(master);src.start();v.start();lfo.start();lfo2.start();
    const PENT=[1047,1175,1319,1568,1760,2093,2349];
    const tick=setInterval(()=>{if(!ctx)return;const t=ctx.currentTime;
      if(Math.random()<.35){const n=2+Math.floor(Math.random()*4);for(let i=0;i<n;i++)click(t+i*.05+Math.random()*.03,2500+Math.random()*1500,.05+Math.random()*.05,.04,far)}
      if(Math.random()<.07){const n=5+Math.floor(Math.random()*6);for(let i=0;i<n;i++)tone(t+i*.09,PENT[Math.floor(Math.random()*PENT.length)],.02,.25,'square',far)}
      if(Math.random()<.012){const s=ctx.createBufferSource();s.buffer=noise;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=.6;
        const cg=ctx.createGain();cg.gain.setValueAtTime(.0001,t);cg.gain.linearRampToValueAtTime(.06,t+.4);cg.gain.linearRampToValueAtTime(.0001,t+1.8);s.connect(bp).connect(cg).connect(far);s.start(t,Math.random());s.stop(t+2)}
    },650);
    amb={stop(){try{src.stop();v.stop();lfo.stop();lfo2.stop()}catch(e){}clearInterval(tick)}}}
  function ambientStop(){if(amb){amb.stop();amb=null}}
  return{init,ambientStart,ambientStop,setVol(v){if(master)master.gain.value=v*VOL_SCALE},
    chip(){if(!on())return;const t=ctx.currentTime;click(t,3400,.55,.045);click(t+.03,2500,.3,.05)},
    hit(type,mag){if(!on())return;const t=ctx.currentTime;const v=Math.min(1,mag/900);
      if(type==='defl'){click(t,3800,.45*v+.05,.03);tone(t,2900,.05*v+.01,.18)}else if(type==='wall'){click(t,900,.25*v+.02,.05)}
      else{click(t,1700+Math.random()*900,.8*v+.03,.035);click(t+.008,4300,.28*v,.02)}},
    rollStart(){if(!on())return;this.rollStop();const s=ctx.createBufferSource();s.buffer=noise;s.loop=true;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.4;bp.frequency.value=1500;
      const g=ctx.createGain();g.gain.value=.0001;s.connect(bp).connect(g).connect(master);s.start();rollN={s,bp,g}},
    rollSet(speed,onRotor,air){if(!rollN)return;const t=ctx.currentTime;const gv=air?.004:Math.min(.2,speed/6500*.2+.01)*(onRotor?.6:1);
      rollN.g.gain.setTargetAtTime(gv,t,.04);rollN.bp.frequency.setTargetAtTime(380+speed*.2,t,.06)},
    rollStop(){if(!rollN)return;const n=rollN;rollN=null;try{n.g.gain.setTargetAtTime(.0001,ctx.currentTime,.05);n.s.stop(ctx.currentTime+.3)}catch(e){}},
    bell(){if(!on())return;const t=ctx.currentTime;tone(t,988,.18,.9);tone(t+.12,1318,.12,1.1)},
    win(){if(!on())return;const t=ctx.currentTime;[523,659,784,1047].forEach((f,i)=>tone(t+i*.09,f,.16,.5,'triangle'))},
    kick(){if(!on())return;const t=ctx.currentTime;tone(t,220,.15,.25,'square');tone(t+.12,180,.12,.3,'square')}};
})();
addEventListener('pointerdown',()=>sfx.init());
addEventListener('keydown',()=>sfx.init());
let dealerVoice=null;
function pickVoice(){if(!('speechSynthesis' in window))return null;const vs=speechSynthesis.getVoices();if(!vs.length)return null;
  const pref=['Guy','Christopher','Davis','David','Mark','Eric','Roger'];for(const p of pref){const v=vs.find(v=>v.name.includes(p)&&/en[-_]US/i.test(v.lang));if(v)return v}
  return vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{dealerVoice=pickVoice()};
function say(text){if(!settings.voice||!settings.sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
  u.rate=.98;u.pitch=.9;u.volume=Math.min(1,settings.volume*1.1*VOL_SCALE);dealerVoice=dealerVoice||pickVoice();if(dealerVoice)u.voice=dealerVoice;speechSynthesis.speak(u)}catch(e){}}
const spoken=n=>n===37?'Double zero, green':n===0?'Zero, green':`${n}, ${colorOf(n)}`;

/* ======================= layout geometry ======================= */
/* Every bet spot is defined once in table units: u runs along the 12 number columns (−1..0 = zero area, 12..13 = "2 to 1"),
   v runs across the 3 number rows (3..4 = dozens, 4..5 = even-money). Each layout maps (u,v) to screen px:
   desktop lays the table horizontally; phone portrait stands it up like a mobile casino layout (0/00 on top,
   1-2-3 across, outside bets down the left side). */
let PORTRAIT=false;
const ZW=66,GX=700,GY=112,CW=64,CH=84,COLW=66,DH=56,EH=56;          // desktop
const P_Y0=296,P_ZH=34,P_RH=31,P_CB=32,P_XN=110,P_NW=100,P_DW=44,P_EW=44; // phone portrait
const GEO={
  land:{X:(u,v)=>u<0?GX+u*ZW:u<=12?GX+u*CW:GX+12*CW+(u-12)*COLW, Y:(u,v)=>v<=3?GY+v*CH:v<=4?GY+3*CH+(v-3)*DH:GY+3*CH+DH+(v-4)*EH,
    cellU:CW,cellV:CH,zeroU:ZW,thick:20,corner:24,mU:14,mV:14,chipIn:36,chipOut:42,rack:{x:760,y:575},dealerY:70},
  port:{X:(u,v)=>v<=3?P_XN+(3-v)*P_NW:v<=4?P_XN-(v-3)*P_DW:P_XN-P_DW-(v-4)*P_EW, Y:(u,v)=>u<0?P_Y0+(u+1)*P_ZH:u<=12?P_Y0+P_ZH+u*P_RH:P_Y0+P_ZH+12*P_RH+(u-12)*P_CB,
    cellU:P_RH,cellV:P_NW,zeroU:P_ZH,thick:13,corner:19,mU:5,mV:16,chipIn:24,chipOut:28,rack:{x:150,y:800},dealerY:250}};
const G=()=>PORTRAIT?GEO.port:GEO.land;
const ptUV=(u,v)=>({x:G().X(u,v),y:G().Y(u,v)});
function rectUV(u0,u1,v0,v1){const a=ptUV(u0,v0),b=ptUV(u1,v1);return{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)}}
function boxUV(u,v,su,sv){const c=ptUV(u,v);const w=PORTRAIT?sv:su,h=PORTRAIT?su:sv;return{rect:{x:c.x-w/2,y:c.y-h/2,w,h},chip:c}}
const numAt=(c,r)=>3*c+(3-r);
function cellRect(n){if(n===0)return rectUV(-1,0,1.5,3);if(n===37)return rectUV(-1,0,0,1.5);
  const c=Math.floor((n-1)/3),r=2-((n-1)%3);return rectUV(c,c+1,r,r+1)}
const ZONES={};
const INSIDE=new Set(['straight','split','street','corner','line','trio','topline']);
function addZone(key,type,nums,payout,rect,chip,name,short,edge){ZONES[key]={key,type,nums,payout,rect,chip,name,short,edge:!!edge,inside:INSIDE.has(type)}}
const ctr=r=>({x:r.x+r.w/2,y:r.y+r.h/2});
function edgeZone(key,type,nums,payout,u,v,su,sv,name,short){const b=boxUV(u,v,su,sv);addZone(key,type,nums,payout,b.rect,b.chip,name,short,1)}
function buildZones(){const g=G(),T=g.thick,K=g.corner,LU=g.cellU-2*g.mU,LV=g.cellV-2*g.mV,QV=g.cellV*.25-6;
  for(const n of [37,0,...range(1,36)]){const r=cellRect(n);addZone('s'+n,'straight',[n],35,r,ctr(r),'Straight up '+lab(n),lab(n))}
  ['3rd','2nd','1st'].forEach((nm,r)=>{const nums=range(0,11).map(c=>numAt(c,r));const rect=rectUV(12,13,r,r+1);addZone('col'+(3-r),'column',nums,2,rect,ctr(rect),nm+' column','Col'+(3-r))});
  ['1st 12','2nd 12','3rd 12'].forEach((nm,i)=>{const rect=rectUV(4*i,4*i+4,3,4);addZone('doz'+(i+1),'dozen',range(12*i+1,12*i+12),2,rect,ctr(rect),nm,'Doz'+(i+1))});
  const ev=[['low','1 to 18',n=>n>=1&&n<=18],['even','Even',n=>n>=1&&n<=36&&n%2===0],['red','Red',n=>RED.has(n)],
            ['black','Black',n=>n>=1&&n<=36&&!RED.has(n)],['odd','Odd',n=>n>=1&&n<=36&&n%2===1],['high','19 to 36',n=>n>=19&&n<=36]];
  ev.forEach(([k,nm,f],i)=>{const rect=rectUV(2*i,2*i+2,4,5);addZone(k,'even',range(1,36).filter(f),1,rect,ctr(rect),nm,nm)});
  for(let c=0;c<11;c++)for(let r=0;r<3;r++){const a=numAt(c,r),b=numAt(c+1,r);edgeZone(`sp${a}_${b}`,'split',[a,b],17,c+1,r+.5,T,LV,`Split ${a}/${b}`,`${a}/${b}`)}
  for(let c=0;c<12;c++)for(let r=0;r<2;r++){const a=numAt(c,r),b=numAt(c,r+1);edgeZone(`sp${b}_${a}`,'split',[b,a],17,c+.5,r+1,LU,T,`Split ${b}/${a}`,`${b}/${a}`)}
  for(let c=0;c<11;c++)for(let r=0;r<2;r++){const nums=[numAt(c,r+1),numAt(c,r),numAt(c+1,r+1),numAt(c+1,r)].sort((p,q)=>p-q);
    edgeZone('cn'+nums.join('_'),'corner',nums,8,c+1,r+1,K,K,'Corner '+nums.join('-'),'C'+nums.join('-'))}
  for(let c=0;c<12;c++){const nums=[3*c+1,3*c+2,3*c+3];edgeZone('st'+(3*c+1),'street',nums,11,c+.5,3,LU,T+2,'Street '+nums.join('-'),'St'+nums.join('-'))}
  for(let c=0;c<11;c++){const nums=range(3*c+1,3*c+6);edgeZone('ln'+(3*c+1),'line',nums,5,c+1,3,K,T+2,`Six line ${3*c+1}–${3*c+6}`,`L${3*c+1}-${3*c+6}`)}
  edgeZone('sp0_37','split',[0,37],17,-.5,1.5,g.zeroU-2*g.mU,T,'Split 0/00','0/00');
  edgeZone('sp37_3','split',[37,3],17,0,.5,T,LV,'Split 00/3','00/3');
  edgeZone('sp0_1','split',[0,1],17,0,2.5,T,LV,'Split 0/1','0/1');
  edgeZone('tr37_2_3','trio',[37,2,3],11,0,1,K,K,'Trio 00-2-3','T00-2-3');
  edgeZone('sp37_2','split',[37,2],17,0,1.25,T,QV,'Split 00/2','00/2');
  edgeZone('tr0_37_2','trio',[0,37,2],11,0,1.5,K,K,'Trio 0-00-2','T0-00-2');
  edgeZone('sp0_2','split',[0,2],17,0,1.75,T,QV,'Split 0/2','0/2');
  edgeZone('tr0_1_2','trio',[0,1,2],11,0,2,K,K,'Trio 0-1-2','T0-1-2');
  edgeZone('top5','topline',[0,37,1,2,3],6,0,3,K,T+2,'Top line 0-00-1-2-3','Top5');
}

/* ======================= strategy recognition & naming ======================= */
const KNOWN={'james-bond':['James Bond','19–36 + six line 13–18 + zero, 14:5:1. Covers 25 of 38 numbers.'],
  snake:['Snake Bet','Straight-ups on the 12 red numbers that zig-zag across the layout.'],
  'two-dozens':['Two Dozens','Two dozens, equal stakes. Covers 24 numbers.'],'two-columns':['Two Columns','Two columns, equal stakes. Covers 24 numbers.'],
  'dozen-column':['Dozen + Column','One dozen and one column, equal stakes. Overlap numbers pay both.'],
  'color-column':['Color/Column Hedge','Red + 2nd column or Black + 3rd column: the column is mostly the other color.'],
  'top-line':['Top Line','0-00-1-2-3. The worst bet on the table: 7.89% house edge.']};
function knownId(b){const ks=Object.keys(b).sort();if(!ks.length)return null;
  if(ks.length===1)return ks[0]==='top5'?'top-line':'one-'+ks[0];
  const has=k=>k in b,only=arr=>ks.length===arr.length&&arr.every(has),eq=arr=>arr.every(k=>b[k]===b[arr[0]]);
  const z=(b.s0||0)+(b.s37||0)+(b.sp0_37||0);

  if(has('high')&&has('ln13')&&z>0&&!jbExtra.length){const r1=b.high/b.ln13,r2=b.ln13/z;if(r1>=2.5&&r1<=3.1&&r2>=3.8&&r2<=6.2)return 'james-bond'}

/* Ball physics: rim wall, sloped bowl, 8 deflectors, rotor step, pocket lips, 38 moving frets the ball can skip over. */
const SZ=1080,C=540,STEP=TAU/38;
const OMEGA=2.4;                      // rotor 2.4 rad/s = 23 RPM, 2.6 s per turn (casino range 20–30 RPM)
const ANG0=Math.random()*TAU;
const rotorAt=t=>mod(ANG0+OMEGA*t/1000,TAU);
let wheelAng=rotorAt(performance.now());
// Roulette ball physics. Units: px in the 1080px wheel canvas (center 540,540 -> origin), seconds.
// Scale: a 32-inch (813 mm) bowl spans 1076 px, so 1 m = 1323 px. Ball 12.5 px radius = 19 mm ball (casino range 18-22 mm).
// Wheelhead (rotor) 20 inches = 508 mm -> radius 336 px, flush with the bottom of the apron.
const N = 38;
const PH = {
  BR: 12.5,          // ball radius
  R_RIM: 468,        // outer wall of ball track
  R_BOWL: 336,       // bowl (stationary) / rotor edge: 20-inch wheelhead
  R_RING: 283,       // number ring inner edge = pocket outer lip
  R_CONE: 238,       // pocket floor inner edge, cone starts rising
  FRET_IN: 225, FRET_OUT: 289, FRET_W: 2.2,
  Z_BOWL: 0, Z_RING: 0, Z_POCKET: -13, FRET_TOP: 3,   // rotor edge flush with the apron
  DEFL_R: 372, DEFL_SIZE: 9, DEFL_TOP: 12,
  M: 1323,           // px per metre
  GZ: 12980,         // gravity 9.81 m/s^2
  R_APRON: 430,      // ball track (r > 440) vs steeper apron down to the rotor
  G_TRACK: 4300,     // effective inward pull on the track (3.2 m/s^2): ball leaves the wall near 1.0 m/s
  G_APRON: 4800,     // steeper apron (3.6 m/s^2)
  G_RING: 6500,      // inward accel on number ring slope
  G_CONE: 2400,      // outward accel per px up the cone
  FR_BOWL0: 100, FR_BOWL2: 2.2e-6, // track deceleration a = c0 + c2*v^2  (0.074 m/s^2 + air drag; ~0.085 m/s^2 at 2 m/s)
  FR_RING0: 140, FR_RING1: 0.6,
  FR_POCK0: 380, FR_POCK1: 3.2,
  E_FLOOR: 0.38, E_FRET: 0.42, E_DEFL: 0.55, E_WALL: 0.18,
  POP_FRET: 0.42, POP_DEFL: 0.32,
};
function floorAt(r) {
  if (r >= PH.R_BOWL) return PH.Z_BOWL;
  if (r >= PH.R_RING) return PH.Z_RING;
  if (r >= PH.R_CONE) return PH.Z_POCKET;
  return PH.Z_POCKET + (PH.R_CONE - r) * 0.9;
}
// simulate one launch. rot0: rotor angle at t=0, omega: rotor rad/s. Returns frames sampled at fps.
function simulate({ rot0, omega, th0, v0, quick, maxT = 45, fps = 120, record = true }) {
  const dt = 1 / 1000;
  const fr0 = quick ? 4 : 1;   // quick mode: unrealistically high track friction
  let x = Math.cos(th0) * (PH.R_RIM - PH.BR - 0.5), y = Math.sin(th0) * (PH.R_RIM - PH.BR - 0.5);
  let vx = Math.sin(th0) * v0, vy = -Math.cos(th0) * v0;   // counter to rotor
  let z = PH.Z_BOWL, vz = 0, t = 0, still = 0, onRotorT = -1, leftWallT = -1, revs = 0, lastTh = Math.atan2(y, x);
  const frames = [], events = [];
  let nextFrame = 0, lastClack = -1;
  const ev = (type, mag) => { if (record && mag > 40) { if (type !== 'clack' || t - lastClack > 0.012) { events.push([t, type, mag]); if (type === 'clack') lastClack = t; } } };
  const defl = []; for (let j = 0; j < 8; j++) { const a = j * TAU / 8 + TAU / 16; defl.push([Math.cos(a) * PH.DEFL_R, Math.sin(a) * PH.DEFL_R]); }
  while (t < maxT) {
    const rot = rot0 + omega * t;
    let r = Math.hypot(x, y);
    const ux = x / r, uy = y / r;            // radial unit
    const F = floorAt(r);
    const contact = z <= F + 0.01;
    // surface velocity
    let sx = 0, sy = 0; const onRotor = r < PH.R_BOWL;
    if (onRotor) { sx = -omega * y; sy = omega * x; }
    if (contact) {
      let ax = 0, ay = 0;
      // slope
      if (r >= PH.R_APRON) { ax -= ux * PH.G_TRACK; ay -= uy * PH.G_TRACK; }
      else if (r >= PH.R_BOWL) { ax -= ux * PH.G_APRON; ay -= uy * PH.G_APRON; }
      else if (r >= PH.R_RING) { ax -= ux * PH.G_RING; ay -= uy * PH.G_RING; }
      else if (r < PH.R_CONE) { const k = (PH.R_CONE - r) * PH.G_CONE; ax += ux * k; ay += uy * k; }
      // rolling resistance relative to surface
      let rx = vx - sx, ry = vy - sy; const rv = Math.hypot(rx, ry);
      if (rv > 1e-6) {
        let c0, c1;
        if (r >= PH.R_BOWL) { c0 = PH.FR_BOWL0 * fr0; c1 = PH.FR_BOWL2 * rv * fr0; } else if (r >= PH.R_RING) { c0 = PH.FR_RING0; c1 = PH.FR_RING1; } else { c0 = PH.FR_POCK0; c1 = PH.FR_POCK1; }
        const dec = Math.min(rv / dt, c0 + c1 * rv);
        ax -= rx / rv * dec; ay -= ry / rv * dec;
      }
      vx += ax * dt; vy += ay * dt;
    } else {
      vz -= PH.GZ * dt;
    }
    x += vx * dt; y += vy * dt; z += vz * dt;
    r = Math.hypot(x, y);
    // floor contact / bounce
    const F2 = floorAt(r);
    if (z < F2) {
      // climbing up a step from below = wall hit (handled below) ; landing from above
      if (vz < -60) { ev('clack', -vz); vz = -vz * PH.E_FLOOR; z = F2; }
      else { z = F2; vz = 0; }
    }
    // outer rim wall
    if (r > PH.R_RIM - PH.BR) {
      const nx = x / r, ny = y / r; const vn = vx * nx + vy * ny;
      x = nx * (PH.R_RIM - PH.BR); y = ny * (PH.R_RIM - PH.BR);
      if (vn > 0) { if (vn > 150) ev('wall', vn); vx -= (1 + PH.E_WALL) * vn * nx; vy -= (1 + PH.E_WALL) * vn * ny; }
    } else if (leftWallT < 0 && r < PH.R_RIM - PH.BR - 4) leftWallT = t;
    r = Math.hypot(x, y);
    // step walls: ball below a higher floor trying to move outward
    const stepWall = (R, zTop) => {
      if (z < zTop - 0.5 && r > R - PH.BR * 0.55 && r < R + PH.BR) {
        const nx = x / r, ny = y / r; const vn = vx * nx + vy * ny;
        const tr = R - PH.BR * 0.55; x = nx * tr; y = ny * tr; r = tr;
        if (vn > 0) { ev('clack', vn * 0.6); vx -= (1 + 0.3) * vn * nx; vy -= (1 + 0.3) * vn * ny; }
      }
    };
    if (r < PH.R_BOWL + PH.BR) stepWall(PH.R_BOWL, PH.Z_BOWL);
    if (r < PH.R_RING + PH.BR) stepWall(PH.R_RING, PH.Z_RING);
    if (onRotorT < 0 && r < PH.R_BOWL - 2) onRotorT = t;
    if (onRotorT < 0) { const th = Math.atan2(y, x); let d = th - lastTh; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; revs += Math.abs(d) / TAU; lastTh = th; }
    // deflectors
    if (r > PH.DEFL_R - 30 && r < PH.DEFL_R + 30 && z < PH.DEFL_TOP) {
      for (const [dx, dy] of defl) {
        const ex = x - dx, ey = y - dy, d = Math.hypot(ex, ey), m = PH.BR + PH.DEFL_SIZE;
        if (d < m) { const nx = ex / d, ny = ey / d; x = dx + nx * m; y = dy + ny * m; const vn = vx * nx + vy * ny;
          if (vn < 0) { ev('defl', -vn); vx -= (1 + PH.E_DEFL) * vn * nx; vy -= (1 + PH.E_DEFL) * vn * ny; vz += Math.min(700, -vn * PH.POP_DEFL); z = Math.max(z, floorAt(Math.hypot(x, y))) + 0.1; } }
      }
    }
    // frets (rotating radial walls)
    r = Math.hypot(x, y);
    if (r > PH.FRET_IN - PH.BR && r < PH.FRET_OUT + PH.BR && z < PH.FRET_TOP) {
      const th = Math.atan2(y, x) - rot; const rel = ((th % TAU) + TAU) % TAU;
      const k0 = Math.floor(rel / STEP - 0.5);
      for (const k of [k0, k0 + 1]) {
        const a = rot + (k + 0.5) * STEP, cx = Math.cos(a), cy = Math.sin(a);
        // closest point on segment
        const proj = Math.max(PH.FRET_IN, Math.min(PH.FRET_OUT, x * cx + y * cy));
        const qx = cx * proj, qy = cy * proj;
        const ex = x - qx, ey = y - qy, d = Math.hypot(ex, ey), m = PH.BR + PH.FRET_W;
        if (d < m && d > 1e-6) {
          const nx = ex / d, ny = ey / d; x = qx + nx * m; y = qy + ny * m;
          const svx = -omega * qy, svy = omega * qx;
          let rx = vx - svx, ry = vy - svy; const vn = rx * nx + ry * ny;
          if (vn < 0) {
            ev('clack', -vn);
            rx -= (1 + PH.E_FRET) * vn * nx; ry -= (1 + PH.E_FRET) * vn * ny;
            rx *= 0.92; ry *= 0.92;
            vx = rx + svx; vy = ry + svy;
            if (-vn > 140) { vz += Math.min(520, (-vn - 120) * PH.POP_FRET); z += 0.2; }
          }
        }
      }
    }
    // settle check
    r = Math.hypot(x, y);
    const relSpeed = Math.hypot(vx + omega * y, vy - omega * x);
    if (r < PH.R_RING && z <= PH.Z_POCKET + 0.5 && Math.abs(vz) < 1 && relSpeed < 18) still += dt; else still = 0;
    if (record && t >= nextFrame) { frames.push([x, y, z, Math.hypot(vx, vy)]); nextFrame += 1 / fps; }
    t += dt;
    if (still > 0.35) {
      const th = Math.atan2(y, x) - rot; const rel = ((th % TAU) + TAU) % TAU;
      const pocket = Math.round(rel / STEP) % N;
      return { ok: true, pocket, T: t, frames, events, onRotorT, leftWallT, revs, relAng: rel, r, fps };
    }
    if (r < 200 || r > 470 || !isFinite(r)) return { ok: false, reason: 'escape' };
  }
  return { ok: false, reason: 'timeout', T: t };
}


const ball={mode:'rest',rel:rngPocket()*STEP,r:267,z:-13,x:0,y:0,v:0,sim:null,trail:[]};
const cam={k:0,target:0};
/* Real-casino flow: bets open -> dealer releases the ball at a random moment -> bets stay open while it circles
   -> "No more bets" a couple of seconds before it leaves the rim -> it drops and settles.
   The OUTCOME COMES FROM THE PHYSICS. Fairness: the dealer's release moment gets a crypto-random delay spread evenly
   over one full rotor turn, so the rotor's position at release is uniform. The wheel is identical pocket-to-pocket,
   so rotating the rotor one pocket shifts the landing number by exactly one -> every number is exactly 1/38. */
const DEALER_ANG=0.25;                       // where the dealer releases the ball (right side, toward the table)
const REV_MS=TAU/OMEGA*1000;                 // one rotor turn
function cryptoFloat(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}
const SPIN_MODES={standard:{v:[1.9,2.45],nmb:2,label:'Standard',desc:'7–12 ball laps, about 15 s. Typical casino spin.'},
  long:{v:[3.0,3.55],nmb:2,label:'Long',desc:'18–24 laps, about 24 s. Hard dealer launch.'},
  quick:{v:[2.6,3.2],nmb:1,label:'Quick',desc:'4–6 laps, about 7 s. Faster than real.'}};
const spinMode=()=>SPIN_MODES[settings.spinMode]?settings.spinMode:'standard';
const launchSpeed=m=>{const r=SPIN_MODES[m].v;return(r[0]+cryptoFloat()*(r[1]-r[0]))*PH.M};   // m/s -> px/s
function scheduleLaunch(delayMs){if(mpClient()||webWatching()){launchAt=0;return}launchAt=delayMs==null?0:performance.now()+delayMs+cryptoFloat()*REV_MS}
function spinAction(){if(webWatching()){toast(`Take a seat to play at table ${web.code}`,true);showMp();return}if(phase!=='betting')return;
  if(inPlay){closeBets();return}
  if(mpClient()){toast('The host spins the ball for the whole table.');return}
  scheduleLaunch(300);toast('Dealer is spinning the ball…');if(mp.on&&mp.host)mpWriteLive()}
function doLaunch(){const t=launchAt,m=spinMode(),q=m==='quick';launchAt=0;let sim=null;
  // a throw that fails to make 3 full laps is a "no spin" under casino procedure, so it is re-thrown
  for(let i=0;i<25&&!(sim&&sim.ok&&sim.revs>=3);i++)sim=simulate({rot0:rotorAt(t),omega:OMEGA,th0:DEALER_ANG,v0:launchSpeed(m),quick:q,record:true});
  if(!sim.ok){scheduleLaunch(500);return}
  ball.sim={...sim,tStart:t,ev:0};ball.mode='phys';ball.trail=[];sfx.rollStart();
  inPlay=true;launchedAt=t;nmbAt=t+Math.max(1.2,sim.leftWallT-SPIN_MODES[m].nmb)*1000;ball.laps=0;ball.lastA=null;mp.staticRot=0;
  if(mp.on&&mp.host)mpPublishSpin(sim,m);renderAll()}
function updateBall(now){if(ball.mode!=='phys')return;const s=ball.sim;const e=(now-s.tStart)/1000;if(e<0)return;
  const F=s.frames,last=F.length-1;
  if(e>=s.T||e*s.fps>=last){const[x,y,z]=F[last];const tf=last/s.fps;
    ball.rel=mod(Math.atan2(y,x)-rotorAt(s.tStart+tf*1000),TAU);ball.r=Math.hypot(x,y);ball.z=z;ball.mode='rest';ball.trail=[];ball.v=0;sfx.rollStop();
    while(s.ev<s.events.length){s.ev++}
    if(settings.zoom)setTimeout(()=>cam.target=0,2300);
    if(phase==='betting')closeBets();inPlay=false;onLanded(s.pocket);return}
  const fi=e*s.fps,i=Math.floor(fi),f=fi-i,A=F[i],B=F[Math.min(last,i+1)];
  ball.x=lerp(A[0],B[0],f);ball.y=lerp(A[1],B[1],f);ball.z=lerp(A[2],B[2],f);ball.v=lerp(A[3],B[3],f);
  ball.trail.push([ball.x,ball.y]);if(ball.trail.length>6)ball.trail.shift();
  if(e<s.onRotorT){const a=Math.atan2(ball.y,ball.x);if(ball.lastA!=null){let d=a-ball.lastA;if(d>Math.PI)d-=TAU;else if(d<-Math.PI)d+=TAU;ball.laps+=Math.abs(d)/TAU}ball.lastA=a}
  while(s.ev<s.events.length&&s.events[s.ev][0]<=e){const[,ty,mag]=s.events[s.ev++];sfx.hit(ty,mag)}
  const r=Math.hypot(ball.x,ball.y);sfx.rollSet(ball.v,r<PH.R_BOWL,ball.z>floorAt(r)+1.5);
  if(settings.zoom&&e>s.onRotorT-.2)cam.target=1}
function ballWorld(){if(ball.mode==='hidden')return null;if(ball.mode==='rest'){const a=wheelAng+ball.rel;return{x:Math.cos(a)*ball.r,y:Math.sin(a)*ball.r,z:ball.z,v:0}}
  if(ball.mode==='phys'&&(performance.now()-ball.sim.tStart)<0)return null;return{x:ball.x,y:ball.y,z:ball.z,v:ball.v}}

const lightLayer=(()=>{const c=mkC(),g=c.getContext('2d');g.save();g.beginPath();g.arc(C,C,538,0,TAU);g.clip();
  let gr=g.createRadialGradient(C-190,C-230,10,C-120,C-150,620);gr.addColorStop(0,'rgba(255,248,235,.16)');gr.addColorStop(.45,'rgba(255,248,235,.03)');gr.addColorStop(1,'rgba(0,0,0,.30)');

const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let zoomCls=false;

    const x0=C+cx*PH.FRET_IN,y0=C+cy*PH.FRET_IN,x1=C+cx*PH.FRET_OUT,y1=C+cy*PH.FRET_OUT;
    g.lineCap='round';g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=5;g.beginPath();g.moveTo(x0+3,y0+4);g.lineTo(x1+3,y1+4);g.stroke();
    g.strokeStyle='#8c6a22';g.lineWidth=4.2;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();

function drawBall(g,b){const x=C+b.x,y=C+b.y,r=Math.hypot(b.x,b.y),fl=floorAt(r),h=Math.max(0,b.z-fl);

  if(b.v>1400&&ball.trail.length>2){ball.trail.forEach(([tx,ty],i)=>{g.beginPath();g.arc(C+tx,C+ty,s*.95,0,TAU);g.fillStyle=`rgba(235,235,235,${.05+.05*i/ball.trail.length})`;g.fill()})}

let lastT=performance.now();
let lastFrameAt=0;
function frame(t){lastFrameAt=performance.now();const dt=Math.min(.05,(t-lastT)/1000);lastT=t;wheelAng=rotorAt(t);updateBall(t);
  cam.k+=(cam.target-cam.k)*Math.min(1,dt*2.2);if(Math.abs(cam.target-cam.k)<.001)cam.k=cam.target;
  drawWheel();updateStatus(t);requestAnimationFrame(frame)}
function updateStatus(t){const st=$('#statusText'),f=$('#timerFill');
  if(webWatching()&&phase==='betting'&&!inPlay){st.textContent=`TABLE ${web.code} · PICK A SEAT TO PLAY`;st.style.color='#ffb3b3';f.style.width='0%';return}
  if(phase==='betting'&&!inPlay){
    if(mpClient()){const L=mp.launchAtLocal?mp.launchAtLocal-t:null;
      if(L==null){st.textContent=hostPeer()?'PLACE YOUR BETS · HOST SPINS':'WAITING FOR A HOST';st.style.color='#ffe6a0';f.style.width='100%';return}
      const left=Math.max(0,L);if(left<=900&&ball.mode==='rest')ball.mode='hidden';f.style.width=Math.min(100,left/(mp.launchSpan+REV_MS)*100)+'%';
      st.textContent=`PLACE YOUR BETS · BALL IN ${Math.ceil(left/1000)}s`;st.style.color='#ffe6a0';return}
    const paused=$('#modal').classList.contains('show')&&!(mp.on&&mp.host);   // a host never pauses the table for everyone
    if(!launchAt){st.textContent='PLACE YOUR BETS · SPACE TO SPIN';st.style.color='#ffe6a0';f.style.width='100%';return}
    if(paused){if(pausedLeft===null)pausedLeft=launchAt-t;st.textContent='PAUSED';return}
    if(pausedLeft!==null){launchAt=t+pausedLeft;pausedLeft=null}
    const left=launchAt-t;if(left<=900&&ball.mode==='rest')ball.mode='hidden';   // dealer picks the ball out of the pocket
    if(left<=0){doLaunch();return}
    const span=(auto&&auto.pace==='fast'?700:settings.timer*1000)+REV_MS;f.style.width=Math.min(100,left/span*100)+'%';
    st.textContent=`PLACE YOUR BETS · BALL IN ${Math.ceil(left/1000)}s`;st.style.color='#ffe6a0'}
  else if(phase==='betting'&&inPlay){
    const left=Math.max(0,nmbAt-t),s=Math.ceil(left/1000);f.style.width=(left/(nmbAt-launchedAt)*100)+'%';
    st.textContent=`LAP ${Math.floor(ball.laps||0)+1} · BETS OPEN ${s}s`;st.style.color=s<=2?'#ff8080':'#ffd27a';
    if(left<=0)closeBets()}
  else if(phase==='spinning'){st.textContent='NO MORE BETS';st.style.color='#ffb3b3';f.style.width='0%'}
  else if(phase==='payout'){st.textContent='PAYING';st.style.color='#a8ffc8';f.style.width='0%'}
  else{st.textContent='BUY IN TO PLAY';st.style.color='#ffe6a0';f.style.width='0%'}}

function wheelTest(){const m=spinMode(),q=m==='quick',N=q?3800:1900,h=new Array(38).fill(0);let done=0,fails=0;

    <div id="wtProg" class="bigv" style="font-size:28px">0%</div><canvas id="wtC" width="1180" height="300" style="width:590px;height:150px;background:#0f0905;border-radius:10px;border:1px solid #33241a"></canvas>

  let stop=false;$('#wtOk').onclick=()=>{stop=true;closeModal()};
  const draw=()=>{const cv=$('#wtC');if(!cv)return;const g=cv.getContext('2d'),W=cv.width,H=cv.height,mx=Math.max(N/38*1.6,...h);g.clearRect(0,0,W,H);
    const e=done/38;g.strokeStyle='rgba(255,230,160,.6)';g.setLineDash([6,6]);g.beginPath();g.moveTo(0,H-e/mx*H);g.lineTo(W,H-e/mx*H);g.stroke();g.setLineDash([]);
    const order=[0,37,...range(1,36)];order.forEach((n,i)=>{const c=h[WHEEL.indexOf(n)],bw=W/38;g.fillStyle={red:'#c41a22',black:'#555',green:'#17a356'}[colorOf(n)];g.fillRect(i*bw+2,H-c/mx*H,bw-4,c/mx*H)})};
  const tick=()=>{if(stop)return;const end=performance.now()+12;
    while(done<N&&performance.now()<end){const r=simulate({rot0:cryptoFloat()*TAU,omega:OMEGA,th0:DEALER_ANG,v0:launchSpeed(m),quick:q,record:false});if(r.ok)h[r.pocket]++;else fails++;done++}

    if(done<N){setTimeout(tick,0);return}
    const n=h.reduce((a,b)=>a+b),e=n/38,chi=h.reduce((a,o)=>a+(o-e)**2/e,0);

function sfc32(a,b,c,d){return function(){a|=0;b|=0;c|=0;d|=0;const t=(a+b|0)+d|0;d=d+1|0;a=b^(b>>>9);b=c+(c<<3)|0;c=(c<<21)|(c>>>11);c=c+t|0;return t>>>0}}

      case'dalembert':if(net<0)mult++;else if(net>0)mult=Math.max(1,mult-1);break;
      case'fibonacci':if(net<0)idx=Math.min(FIB.length-1,idx+1);else if(net>0)idx=Math.max(0,idx-2);break;

    const s=Math.max(1,Math.min(P.cap,Math.round(Math.pow(10,(mx-L)/(W-L-R)*lc))));cx.setAttribute('x1',x(s));cx.setAttribute('x2',x(s));cx.style.display='';

    tip.innerHTML=`<div style="color:#a88e6a;margin-bottom:4px">After ${s.toLocaleString()} spins · ${fmtTime(s)}</div>`+rows.map(({q,v})=>`<div class="row"><i style="display:inline-block;width:14px;height:3px;border-radius:2px;background:${LAB_COLORS[q.color]}"></i><b>${pct(v)}</b><span>${esc(q.name)}</span></div>`).join('');

/* Runs only on the shared claude.ai page (needs the room, db and user capabilities).

/* ======================= my strategies: saved, remembered, shareable ======================= */
/* Two copies of your saved strategies:
   1. this device (localStorage) — always, including the desktop file;
   2. your claude.ai account (private db document data/users/<you>/library) on the shared page, so they
      survive a cleared browser and show up on every device where you open the page signed in.
   Deletes are kept as small "deleted" markers so a delete on one device wins on the others. */
const lib={data:null,status:'device',ref:null,lastPushed:'',pushT:null,writing:false,again:false,seenShares:new Set()};
function cleanBets(b){const o={};if(!b||typeof b!=='object')return o;for(const k in b){if(!ZONES[k])continue;const a=Math.round(+b[k]);if(a>=1&&a<=100000)o[k]=a}return o}
function cleanItem(r){const bets=cleanBets(r.bets);const prog=PROGS[r.prog]?r.prog:'flat';
  const custom=Array.isArray(r.custom)?r.custom.map(x=>Math.round(+x)).filter(x=>x>=1&&x<=1000).slice(0,20):[1];
  const name=String(r.name||'').replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,40)||nameOf(sidOf(bets));
  const num=v=>Number.isFinite(+v)?+v:0;
  return{id:typeof r.id==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(r.id)?r.id:newLibId(),name,bets,prog,custom:custom.length?custom:[1],onCap:r.onCap==='stop'?'stop':'reset',
    fav:!!r.fav,code:typeof r.code==='string'&&/^[A-Z2-9]{6}$/.test(r.code)?r.code:null,created:num(r.created)||Date.now(),updated:num(r.updated)||Date.now(),lastUsed:num(r.lastUsed),deleted:!!r.deleted,note:String(r.note||'').slice(0,140)}}
function newLibId(){return's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function libLoad(){let d=store.get('rr_lib',null);
  if(!d||!Array.isArray(d.items)){d={v:1,items:[]};for(const p of store.get('rr_patterns',[]))d.items.push(cleanItem({name:p.name,bets:p.bets}))}   // carry over old saved patterns
  d.items=d.items.map(cleanItem).filter(x=>x.deleted||Object.keys(x.bets).length);lib.data=d;libApplyNames()}
const libItems=()=>lib.data.items.filter(x=>!x.deleted).sort((a,b)=>(b.fav-a.fav)||((b.lastUsed||b.updated)-(a.lastUsed||a.updated)));
function libApplyNames(){const m=store.get('rr_names',{});for(const it of lib.data.items){if(it.deleted)continue;const sid=sidOf(it.bets);if(sid)m[sid]=it.name}store.set('rr_names',m)}
function libSave(){store.set('rr_lib',lib.data);libApplyNames();libPushSoon();renderStrategy()}
function libAdd(item){const it=cleanItem(item);if(!Object.keys(it.bets).length)return null;
  const dup=libItems().find(x=>sidOf(x.bets)===sidOf(it.bets)&&sum(x.bets)===sum(it.bets)&&x.prog===it.prog);
  if(dup){dup.name=it.name;dup.updated=Date.now();libSave();return dup}
  lib.data.items.push(it);libSave();setTimeout(()=>ensureShortCode(it),1500);return it}
/* ---- account sync ---- */
// Never write to the account copy until this device has read it: a fresh device must merge first, or it would overwrite your list.
async function libCloudInit(){if(!mp.db||!mp.myId)return;try{lib.ref=mp.db.doc('data/users/'+mp.myId+'/library')}catch(e){return}
  lib.ref.onSnapshot(s=>{if(s.metadata.fromCache&&!lib.ready)return;if(s.exists&&!s.metadata.hasPendingWrites)libMerge(s.data());
    if(!lib.ready){lib.ready=true;libPush(true).then(()=>{for(const it of libItems())if(!it.code){ensureShortCode(it);break}})}},()=>{})}
function libMerge(remote){if(!remote||!Array.isArray(remote.items))return;const byId={};for(const it of lib.data.items)byId[it.id]=it;let changed=false;
  for(const raw of remote.items){if(!raw||typeof raw.id!=='string')continue;const r=cleanItem(raw);const l=byId[r.id];
    if(!l||r.updated>l.updated){byId[r.id]=r;changed=true}}
  if(remote.names&&typeof remote.names==='object'){const m=store.get('rr_names',{});let ch=false;for(const k in remote.names)if(!(k in m)&&typeof remote.names[k]==='string'){m[k]=remote.names[k].slice(0,40);ch=true}if(ch){store.set('rr_names',m);changed=true}}
  if(changed){lib.data.items=Object.values(byId);store.set('rr_lib',lib.data);libApplyNames();renderStrategy();if(libOpen())showLibrary()}}
async function libPush(force){if(!lib.ref||!lib.ready)return;const js=JSON.stringify({v:1,items:lib.data.items,names:store.get('rr_names',{})});
  if(!force&&js===lib.lastPushed)return;if(lib.writing){lib.again=true;return}
  lib.writing=true;try{await lib.ref.set(JSON.parse(js));lib.lastPushed=js;lib.status='cloud'}catch(e){lib.status='device'}
  lib.writing=false;if(libOpen())$('#libStatus').innerHTML=libStatusText();if(lib.again){lib.again=false;libPush()}}
function libPushSoon(){clearTimeout(lib.pushT);lib.pushT=setTimeout(()=>libPush(),700)}
function libStatusText(){return lib.status==='cloud'?'<span class="ok">✓ Saved to your claude.ai account.</span> They\'re here on any device where you open this page signed in.'
  :location.protocol==='file:'?'Saved on this computer. To move them to your phone, use <b>Share</b> and paste the code into the phone page.'
  :'Saved on this device. Use <b>Share</b> codes to keep a copy anywhere else.'}
/* ---- strategy codes ----
   Short code  K7Q-2MX : 6 characters (no 0/O, 1/I/L), saved on the shared page under codes/<CODE>; anyone with the page
                         link can look it up. Made by whoever can write to the page (Ian); others get a backup code.
   Backup code RR2-…   : the whole strategy packed into ~40 characters, works anywhere, including the desktop copy.
   Old RR1-… codes still import. */
const CODE_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const fmtShort=c=>c.slice(0,3)+'-'+c.slice(3);
function newShortCode(){const a=new Uint32Array(6);crypto.getRandomValues(a);let s='';for(const x of a)s+=CODE_ABC[x%CODE_ABC.length];return s}

  if(!m)return null;const c=m[1]+m[2];return[...c].every(ch=>CODE_ABC.includes(ch))?c:null}
let ZK=null;const zk=()=>ZK||(ZK=Object.keys(ZONES).sort());
const PROG_CH={martingale:'m',paroli:'p',dalembert:'d',fibonacci:'f',custom:'c'};
function stratCode(it){const keys=zk();
  let c='RR2-'+Object.entries(it.bets).map(([k,a])=>keys.indexOf(k).toString(36).padStart(2,'0')+a.toString(36)).join('.');
  c+='~'+String(it.name||'').replace(/[^A-Za-z0-9 ]/g,'').trim().replace(/ +/g,'_').slice(0,30);
  if(it.prog&&it.prog!=='flat')c+='!'+PROG_CH[it.prog]+(it.onCap==='stop'?'s':'')+(it.prog==='custom'?it.custom.join('_'):'');
  return c}
function parseCode(txt){const t=String(txt||'');
  const m2=t.match(/RR2-([0-9a-z.]+)(?:~([A-Za-z0-9_]*))?(?:!([mpdfc])(s?)([0-9_]*))?/);
  if(m2){const keys=zk(),b={};for(const part of m2[1].split('.')){if(part.length<3)return null;const k=keys[parseInt(part.slice(0,2),36)];const a=parseInt(part.slice(2),36);if(!k||!(a>0))return null;b[k]=a}
    const prog=m2[3]?Object.keys(PROG_CH).find(k=>PROG_CH[k]===m2[3]):'flat';
    const it=cleanItem({name:(m2[2]||'').replace(/_/g,' '),bets:b,prog,onCap:m2[4]?'stop':'reset',custom:m2[5]?m2[5].split('_'):[1]});delete it.id;return Object.keys(it.bets).length?it:null}
  const m=t.match(/RR1-([A-Za-z0-9_-]{8,8000})/);if(!m)return null;
  try{let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const o=JSON.parse(decodeURIComponent(escape(atob(b))));
    const it=cleanItem({name:o.n,bets:o.b,prog:o.p,custom:o.c,onCap:o.o});delete it.id;return Object.keys(it.bets).length?it:null}catch(e){return null}}
const canMakeShort=()=>!!(mp.db&&mp.myId&&mp.canWrite!==false&&(lib.status==='cloud'||fb.on));
async function ensureShortCode(it){if(it.code||!canMakeShort())return it.code||null;
  for(let i=0;i<4;i++){const c=newShortCode();const ref=mp.db.doc('codes/'+c);
    try{const s=await ref.get();if(s.exists)continue;
      await ref.set({n:it.name,b:it.bets,p:it.prog,o:it.onCap,c:it.custom,at:Date.now()});it.code=c;it.updated=Date.now();libSave();return c}catch(e){mp.canWrite=false;return null}}
  return null}
async function lookupShort(c){if(!mp.db)return{err:FIREBASE_CONFIG?'Still connecting. Try again in a moment.':'Short codes are looked up on the shared American Roulette page. In this copy, use the backup code (RR2-…).'};
  try{const s=await mp.db.doc('codes/'+c).get();if(!s.exists)return{err:`No strategy has the code ${fmtShort(c)}. Check the letters and try again.`};
    const d=s.data();const it=cleanItem({name:d.n,bets:d.b,prog:d.p,onCap:d.o,custom:d.c});delete it.id;it.code=c;return Object.keys(it.bets).length?{it}:{err:'That code is empty.'}}
  catch(e){return{err:'Could not look that code up right now. Try again in a moment.'}}}
async function importAny(txt){const short=findShort(txt);if(short)return lookupShort(short);const it=parseCode(txt);
  return it?{it}:{err:'That isn\'t a strategy code. Codes look like K7Q-2MX, or start with RR2- or RR1-.'}}

/* ======================= multiplayer on one device (up to 5 players) ======================= */
/* Each player is a full session of their own (bankroll, stats, history, strategy naming), with their own chip color.
   The globals S / bets / roundBets / lastBets / undoStack always hold the player you're betting for; switching
   players stashes those and loads the other player's. Round steps (no more bets, payout, next round) run for
   every player in turn. Everyone shares the table minimum, the wheel and the result. */
const GP_COLORS=[{c:'#2f6fd6',n:'Blue'},{c:'#e07a1f',n:'Orange'},{c:'#13a39f',n:'Teal'},{c:'#d6457f',n:'Pink'},{c:'#d9b416',n:'Gold'}];
const grp={on:false,players:[],cur:0,fx:null};
function gNew(name,color,buy,min,tag,id){const s=newSession(buy,min,tag?`${tag} · ${name}`:name);s.id=id;
  return{name,color,S:s,bets:{},roundBets:{},lastBets:null,undo:[],carry:null,walkAfter:false}}
function gStash(){if(!grp.on)return;const p=grp.players[grp.cur];if(!p)return;p.S=S;p.bets=bets;p.roundBets=roundBets;p.lastBets=lastBets;p.undo=undoStack}
function gLoad(i){const p=grp.players[i];if(!p)return;grp.cur=i;S=p.S;bets=p.bets;roundBets=p.roundBets;lastBets=p.lastBets;undoStack=p.undo}
function gEach(fn){gStash();const keep=grp.players[grp.cur];grp.players.forEach((p,i)=>{gLoad(i);fn(p,i);gStash()});
  const k=grp.players.indexOf(keep);gLoad(k<0?0:k)}

    nk.onchange=()=>{const v=nk.value.trim().slice(0,24);mp.nick=before;if(v)webSetName(v);else nk.value=before};nk.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')nk.blur()}}
  $('#wCopy').onclick=()=>{const done=()=>toast('Invite link copied. Send it to your friends.');try{navigator.clipboard.writeText(link).then(done,()=>copyText(link,'Invite link'))}catch(e){copyText(link,'Invite link')}};
  $('#wStats').onclick=showTableStats;
  document.querySelectorAll('[data-seat]').forEach(b=>b.onclick=async()=>{if(!S){closeModal();return}const i=+b.dataset.seat;
    if(mp.on){mp.seat=i;mpPresence(true);renderSeats();webLobby();return}
    mpJoin(i);if(web.wantHost&&!hostPeer()){web.wantHost=false;await mpStartHost()}webLobby()});
  if($('#wMin'))bindSeg('wMin',v=>webSetTable(v,null));if($('#wTimer'))bindSeg('wTimer',v=>webSetTable(null,v));
  $('#mpX').onclick=closeModal;$('#wLeave').onclick=()=>{webLeaveRoom();webLobby()};
  if($('#mpHost'))$('#mpHost').onclick=async()=>{await mpStartHost();webLobby()}}

/* ======================= wiring ======================= */
$('#bUndo').onclick=undo;$('#bClear').onclick=clearBets;$('#bRebet').onclick=rebet;$('#bDouble').onclick=doubleBets;$('#spinBtn').onclick=spinAction;
$('#bPat').onclick=showPatterns;$('#bMp').onclick=()=>showMp();$('#histLink').onclick=e=>{e.preventDefault();if(S)showHistory()};$('#hintR').addEventListener('click',e=>{if(e.target.closest('#toLab')){e.preventDefault();quickLab()}else if(e.target.closest('#netsT')){e.preventDefault();toggleNets()}});$('#bMenu').onclick=showMenu;$('#bLab').onclick=()=>showLab(!S);$('#bAuto').onclick=showAuto;
$('#bWalk').onclick=()=>{if(S)walkAway()};
$('#betInfo').addEventListener('click',e=>{const b=e.target.closest('[data-gp]');if(b)gSelect(+b.dataset.gp)});
$('#gSel').addEventListener('click',e=>{const b=e.target.closest('[data-gp]');if(b)gSelect(+b.dataset.gp)});
$('#gPanel').addEventListener('click',e=>{const c=e.target.closest('[data-gcard]');if(c)gShowPlayer(+c.dataset.gcard);else if(e.target.closest('#gAdd'))gShowAddPlayer()});
$('#oPanel').addEventListener('click',e=>{if(e.target.closest('[data-ren]')){e.stopPropagation();webRename();return}const c=e.target.closest('[data-op]');if(c)showPeer(c.dataset.op)});
$('#seats').addEventListener('click',e=>{const c=e.target.closest('[data-op]');if(c&&fb.on)showPeer(c.dataset.op)});
$('#chatGo').onclick=()=>webSay($('#chatTx'));$('#chatTx').addEventListener('keydown',e=>{if(e.key==='Enter')webSay($('#chatTx'))});
$('#reacts').addEventListener('click',e=>{const b=e.target.closest('[data-re]');if(b)webReact(b.dataset.re)});
$('#chatOpen').onclick=showChat;$('#chatLast').onclick=showChat;
$('#gMini').addEventListener('click',e=>{const c=e.target.closest('[data-gcard]');if(c)gShowPlayer(+c.dataset.gcard)});$('#bAdd').onclick=showAddChips;$('#bLife').onclick=()=>showLifetime(!S);$('#bSet').onclick=showSettings;
addEventListener('keydown',e=>{if($('#modal').classList.contains('show')){if(e.key==='Escape'&&modalCloseable)closeModal();return}
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(e.key==='Tab'){if(grp.on){e.preventDefault();const n=grp.players.length;gSelect((grp.cur+(e.shiftKey?n-1:1))%n)}return}
  if(e.key>='1'&&e.key<='5'){selDenom=DENOMS[+e.key-1];sfx.chip();renderRack()}
  else if(e.code==='Space'){e.preventDefault();spinAction()}else if(k==='r')rebet();else if(k==='d')doubleBets();
  else if(k==='z'||e.key==='Backspace')undo();else if(k==='c')clearBets();else if(k==='p')showLibrary();else if(k==='a'&&S)showAuto();else if(k==='l')showLab(!S);else if(k==='h'&&S)showHistory();else if(k==='n'&&S)toggleNets()});
addEventListener('contextmenu',e=>e.preventDefault());
let WK=1;
function fit(){const w=$('#wrap'),vv=window.visualViewport,W0=Math.min(w.clientWidth||innerWidth,vv?vv.width:1e9),H0=Math.min(w.clientHeight||innerHeight,vv?vv.height:1e9);const port=W0<760||H0>W0*1.1;
  if(port!==PORTRAIT){PORTRAIT=port;applyOrientation()}
  document.body.classList.toggle('rotate',port&&W0>H0&&H0<500);
  const SW=PORTRAIT?430:1600,SH=PORTRAIT?860:900,s=Math.min(W0/SW,H0/SH);
  $('#stage').style.transform=`translate(${(W0-SW*s)/2}px,${(H0-SH*s)/2}px) scale(${s})`}
function applyOrientation(){document.body.classList.toggle('portrait',PORTRAIT);
  const cv=$('#wheel'),res=PORTRAIT?560:1080;if(cv.width!==res){cv.width=cv.height=res}WK=res/SZ;
  for(const k in chipEls){chipEls[k].remove();delete chipEls[k]}document.querySelectorAll('#chips .payf').forEach(e=>e.remove());
  buildZones();buildLayout();$('#dolly').style.display='none';renderAll();renderHistory();renderMpChips();renderSeats();if($('#labChart'))drawSurvival()}
function showMenu(){const b=S&&phase==='betting';
  openModal(`<h2>Menu</h2><div class="menu">
    <button class="btn" id="mnAdd" ${b?'':'disabled'}>+ Chips</button><button class="btn" id="mnStats" ${S?'':'disabled'}>Session stats</button><button class="btn" id="mnHist" ${S?'':'disabled'}>Bet history</button>
    <button class="btn" id="mnPat">My strategies</button><button class="btn" id="mnAuto" ${S&&phase!=='idle'&&!grp.on?'':'disabled'}>${auto?'Stop auto-play':'Auto-play'}</button>
    <button class="btn" id="mnToLab" ${S&&(tableTotal()||sum(roundBets)||lastBets)?'':'disabled'}>Table → Lab</button><button class="btn" id="mnMp">${fb.on?'Play online':'Play with friends'}</button>${fb.on&&mp.on?'<button class="btn" id="mnTS">Table stats</button><button class="btn" id="mnChat">Table chat</button>':''}<button class="btn" id="mnLab">Strategy Lab</button><button class="btn" id="mnLife">Lifetime</button>
    <button class="btn" id="mnSet">Settings</button><button class="btn red" id="mnWalk" ${S?'':'disabled'}>${grp.on?'Everyone walks away':'Walk away'}</button></div>
    <div class="mrow"><button class="btn gold" id="mnX">Back to the table</button></div>`);
  $('#mnX').onclick=closeModal;$('#mnAdd').onclick=showAddChips;$('#mnStats').onclick=showStatsModal;$('#mnHist').onclick=()=>showHistory();$('#mnPat').onclick=showPatterns;$('#mnAuto').onclick=()=>{if(auto){closeModal();stopAuto('Stopped by you')}else showAuto()};
  $('#mnLab').onclick=()=>showLab(!S);$('#mnMp').onclick=()=>showMp();if($('#mnTS'))$('#mnTS').onclick=showTableStats;if($('#mnChat'))$('#mnChat').onclick=showChat;$('#mnToLab').onclick=quickLab;$('#mnLife').onclick=()=>showLifetime(!S);$('#mnSet').onclick=showSettings;$('#mnWalk').onclick=()=>{closeModal();walkAway()}}
/* Bet history: what you put down, what the table paid back, and the real result of each spin.
   A spin where one of your bets hit but the payout was smaller than the total you bet is flagged "Hit, still lost". */
let SHORT2KEY=null;   // built on first use: ZONES is filled in after this script loads
function parseBetStr(str){if(!SHORT2KEY){SHORT2KEY={};for(const k in ZONES)SHORT2KEY[ZONES[k].short]=k}return(str||'').split(' ').filter(Boolean).map(t=>{const i=t.lastIndexOf(':');return{k:SHORT2KEY[t.slice(0,i)],a:+t.slice(i+1)}}).filter(x=>x.k)}
function showHistory(all=false,s0){const s=s0||S;if(!s)return;const who=grp.on?gWho(s):null;
  const spins=s.spins.slice().reverse(),shown=all?spins:spins.slice(0,10);
  const hit=x=>x.ret>0,fake=x=>x.ret>0&&x.net<0;
  const tot=shown.reduce((a,x)=>a+x.net,0),wag=shown.reduce((a,x)=>a+x.wager,0),ret=shown.reduce((a,x)=>a+x.ret,0);
  const rows=shown.map(x=>{const bl=parseBetStr(x.bets);const wins=bl.filter(b=>ZONES[b.k].nums.includes(x.n));
    const tag=fake(x)?'<span class="tag fake">HIT, STILL LOST</span>':x.net>0?'<span class="tag won">WON</span>':x.net===0&&x.ret>0?'<span class="tag won">PUSH</span>':'<span class="tag miss">MISSED</span>';
    const hl=wins.length?`Hit: ${wins.map(b=>`<b>${esc(ZONES[b.k].name)}</b> ${money(b.a)} → paid ${money(b.a*(ZONES[b.k].payout+1))}`).join(' · ')}`:'Nothing hit';
    return`<tr class="main"><td>${x.i}</td><td>${lnHtml(x.n)}${tag}</td><td>${money(x.wager)}</td><td>${money(x.ret)}</td><td class="${cls(x.net)}"><b>${smoney(x.net)}</b></td></tr>
      <tr class="sub"><td></td><td colspan="4" class="hitline">${hl} <span style="opacity:.75">(${wins.length} of ${bl.length} bet${bl.length===1?'':'s'})</span></td></tr>`}).join('');
  openModal(`<h2>Bet history${who?` · <span style="color:${GP_COLORS[who.color].c}">${esc(who.name)}</span>`:''}</h2><div class="sub">${all?`All ${spins.length} spins this session`:`Last ${shown.length} of ${spins.length} spins`}, newest first. "Paid back" is everything the table returned, including the chips you bet on winning spots. Net is what the spin actually did to your stack.</div>
    <div class="hsum">
      <div><div class="k">Bet</div><div class="v">${money(wag)}</div></div>
      <div><div class="k">Paid back</div><div class="v">${money(ret)}</div></div>
      <div><div class="k">Net</div><div class="v ${cls(tot)}">${smoney(tot)}</div></div>
      <div><div class="k">Something hit</div><div class="v">${shown.filter(hit).length} <span style="font-size:12px;color:#a88e6a">of ${shown.length}</span></div></div>
      <div><div class="k">Actually won</div><div class="v">${shown.filter(x=>x.net>0).length} <span style="font-size:12px;color:#a88e6a">· ${shown.filter(fake).length} hit but lost</span></div></div></div>
    ${shown.length?`<div class="tscroll" style="max-height:${PORTRAIT?520:470}px;margin-top:0"><table class="hist"><tr><th>Spin</th><th>Result</th><th>Bet</th><th>Paid back</th><th>Net</th></tr>${rows}</table></div>`:'<div class="note">No bets yet this session.</div>'}
    <div class="mrow">${spins.length>10?`<button class="btn" id="hsAll">${all?'Show last 10':`Show all ${spins.length} spins`}</button>`:''}<button class="btn gold" id="hsX">Back to the table</button></div>`,true);
  $('#hsX').onclick=closeModal;if($('#hsAll'))$('#hsAll').onclick=()=>showHistory(!all,s)}
function showStatsModal(){if(!S)return;if(grp.on)return gShowPlayer(grp.cur);renderStats();
  openModal(`<h2>This session</h2><div class="sub">${S.tag?esc(S.tag)+' · ':''}${money(S.min)} table · ${Math.round((Date.now()-S.start)/60000)} min</div>
    <div class="sgrid">${$('#sessGrid').innerHTML}</div><div class="ph"><span>Session net, by spin</span></div>
    <canvas id="mChart" width="780" height="340" style="width:100%;height:170px;margin-top:6px;border-radius:10px;background:#100a06;border:1px solid #33241a"></canvas>
    <div class="mrow"><button class="btn gold" id="msX">Back to the table</button></div>`);
  drawChart($('#mChart'));$('#msX').onclick=closeModal}
/* A background, minimized or covered window can stop getting animation frames (sometimes while still reporting
   itself as visible), which would freeze the dealer and, for a host, the whole online table. When frames stop,
   this slower tick keeps the round moving. */
setInterval(()=>{if(performance.now()-lastFrameAt<400)return;const t=performance.now();wheelAng=rotorAt(t);updateBall(t);updateStatus(t)},250);
addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);
setInterval(()=>{if(S&&phase==='betting')renderStats()},30000);
setInterval(()=>{if(mp.on)mpPresence(true)},15000);   // heartbeat: a missed presence write is repaired within 15 s

buildZones();libLoad();buildLayout();fit();renderRack();requestAnimationFrame(frame);showBuyIn();mpInit();
</script>
